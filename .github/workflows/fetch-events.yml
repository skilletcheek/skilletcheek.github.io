name: Fetch events nightly

on:
  schedule:
    # Twice daily, on purpose. GitHub does not guarantee scheduled runs — under
    # load they are delayed and sometimes dropped outright, and on 2026-08-27
    # the 09:00 slot never fired at all. Because the hub pages bake "today" in
    # at build time, a skipped run leaves /tonight/ serving YESTERDAY's events
    # under a heading that says TONIGHT, silently and all day. The second slot
    # is the self-heal: it no-ops when the first one worked (the commit step
    # already exits quietly when nothing changed).
    - cron: "0 9 * * *"    # 09:00 UTC = 3-4 AM Dallas
    - cron: "0 17 * * *"   # 17:00 UTC = 11 AM-noon Dallas, catches a dropped 09:00
  workflow_dispatch: {}    # allows manual "Run workflow" button in the Actions tab

permissions:
  contents: write

# Two schedules plus a manual dispatch can otherwise overlap and race on the
# same push. Let a run in progress finish rather than cancelling it — a partial
# regenerate that gets killed mid-write is worse than a slightly late one.
concurrency:
  group: fetch-events
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and aggregate events
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          # Where write_hubs() drops the list of pages whose bytes actually
          # moved. Outside the repo, so a run leaves nothing untracked behind.
          INDEXNOW_URLS_OUT: ${{ runner.temp }}/indexnow-urls.json
        run: python scripts/fetch_events.py

      - name: Commit if changed
        run: |
          git config user.name "events-bot"
          git config user.email "actions@users.noreply.github.com"
          # Every path fetch_events.py generates must be listed here. It writes
          # them to the runner's disk either way, so anything missing is thrown
          # away at the end of the job while sitemap.xml still advertises it --
          # which is how 14 venue pages 404'd for 18 days. If you add a writer
          # to fetch_events.py, add its directory here in the same commit.
          # feed.xml and calendar.ics are the site-wide RSS/iCalendar feeds.
          # The .txt is IndexNow's ownership proof, named after INDEXNOW_KEY in
          # fetch_events.py -- rotate that constant and this line changes too.
          # (A wrong or missing name is loud, not silent: the submit step
          # reports "403 - key file not reachable".)
          # The per-district, per-city and per-venue calendar.ics files live
          # inside directories already listed here, so those are covered.
          git add -A live-events.json press.json sitemap.xml robots.txt eventbrite.json \
                     source-counts.json \
                     feed.xml calendar.ics ffd9813217969d9353baca4cea7b0cb1.txt \
                     tonight this-weekend free-events district venue city advertise submit
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: nightly refresh of live-events.json"
            # Rebase-and-retry rather than a bare push: social-post.yml also
            # pushes to main now, twice a day (13:00 and 17:00 UTC -- the
            # second exactly matches this workflow's own catch-up cron below,
            # deliberately), and either workflow can be delayed or manually
            # dispatched onto the other. A rejected push here would throw
            # away the whole night's regenerate.
            ./.github/push-with-retry.sh
          fi

      # AFTER the push, and in its own step, because the engines fetch what we
      # point them at: submitting before GitHub Pages has deployed would have
      # every one of them re-crawl the PREVIOUS version of each page. Same
      # ordering the social poster needs for the same reason, and cmd_indexnow
      # blocks on the deploy actually landing before it submits.
      #
      # continue-on-error: an indexing hint must never be able to fail the run
      # that regenerates the site. A failure here shows red on the step and
      # green on the job, which is the visibility this deserves and no more.
      - name: Submit changed URLs to IndexNow
        continue-on-error: true
        run: python scripts/fetch_events.py indexnow "$RUNNER_TEMP/indexnow-urls.json"

      # LAST, and deliberately NOT continue-on-error: this is the one thing in
      # this workflow that is supposed to turn the job red.
      #
      # COLLAPSE_GUARD_RATIO only watches the total, which is too coarse to
      # see one source die. On 2026-09-11 all six Prekindle pages 404'd --
      # 68 events of independent live music, Granada through Trees -- and the
      # feed still came to 97% of the previous night, so the site published
      # without them and nothing went red.
      #
      # It runs AFTER the commit on purpose. Failing earlier would skip the
      # commit and leave /tonight/ serving yesterday, which is worse than a
      # feed that is briefly short one venue class. The site refreshes either
      # way; this only makes the degradation visible.
      - name: Check per-source health
        run: python scripts/fetch_events.py sourcecheck
