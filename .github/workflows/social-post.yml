name: Daily social post

# Deliberately its own workflow rather than a job bolted onto
# fetch-events.yml. The nightly refresh is the site; this is marketing. A dead
# Meta token, a rate limit or an Instagram outage must never be able to leave
# /tonight/ serving yesterday, and a collapsed feed (COLLAPSE_GUARD_RATIO)
# must never be able to post garbage. Neither one can fail the other here.

on:
  # Three posts a day since 2026-09-02, each with distinct picks -- see
  # already_posted_today() in social_post.py, which hard-excludes anything
  # an earlier slot already featured. Target wall-clock times are Dallas
  # CDT (UTC-5, the offset in effect when these were chosen): 8:00 AM,
  # 12:00 PM, 3:00 PM. Once Dallas falls back to CST (UTC-6) in November
  # every trigger below reads an hour earlier on the clock until DST
  # resumes -- the same tolerance fetch-events.yml already accepts for its
  # own cron comments.
  #
  # THE CRON TIMES BELOW ARE NOT THE TARGET TIMES. Checking fetch-events.yml's
  # own history (a workflow this one never touches) found EVERY recorded
  # scheduled run over 8 samples delayed 2.56-5.07h behind its nominal cron
  # time (mean 3.93h, median 4.68h) -- a property of GitHub's scheduler on
  # this repo during roughly 4 AM-1 PM Eastern (its own peak shared-runner
  # demand window), not a bug in either workflow. So each PRIMARY cron is
  # scheduled ~4h BEFORE its real target, betting on that typical delay to
  # carry the actual run to near the target instead of hours past it:
  #
  #   slot        target (CDT)   primary cron (UTC)   primary cron (CDT)
  #   morning     8:00 AM        09:00                4:00 AM
  #   midday      12:00 PM       13:00                8:00 AM
  #   afternoon   3:00 PM        16:00                11:00 AM
  #
  # This is a best-effort correction against a noisy distribution, not a
  # guarantee -- a below-average delay lands the post noticeably EARLY of
  # target, an above-average one lands it noticeably LATE. Each slot still
  # gets a CATCH-UP cron +5h after its own primary, the same self-heal
  # shape fetch-events.yml uses and unchanged in purpose: it is a second,
  # independent draw from the same delay distribution, not a faster or more
  # reliable one, so it shrinks the odds a whole slot is missed outright
  # without making any post land "on time" in a strict sense. If a specific
  # day needs a post out by a real deadline, that means a manual dispatch
  # (Actions > Daily social post > Run workflow), not a shorter cron gap --
  # no gap this workflow can set escapes GitHub's own queuing delay.
  #
  # Build is idempotent per (date, slot) (already_posted_today() /
  # cmd_build()'s "already posted" skip), so whichever of a slot's two crons
  # actually fires first does the real work and the other is a free no-op --
  # there is no cost to keeping both, and no risk of a double post.
  #
  # 09:00 UTC (morning's primary) exactly matches fetch-events.yml's own
  # 09:00 UTC primary cron -- a known, accepted overlap between the two
  # workflows, not a collision within this one's own case statement below
  # (every cron string in THIS workflow is unique). Both push through
  # push-with-retry.sh, so a same-minute collision costs a retry, not a
  # broken run.
  schedule:
    - cron: "0 9 * * *"     # morning primary  (targets 8:00 AM CDT)
    - cron: "0 14 * * *"    # morning catch-up (+5h)
    - cron: "0 13 * * *"    # midday primary   (targets 12:00 PM CDT)
    - cron: "0 18 * * *"    # midday catch-up  (+5h)
    - cron: "0 16 * * *"    # afternoon primary  (targets 3:00 PM CDT)
    - cron: "0 21 * * *"    # afternoon catch-up (+5h)
  workflow_dispatch:
    inputs:
      slot:
        description: "Which of the day's three posts to run (ignored on a schedule -- that's inferred from which cron fired)"
        type: choice
        options: [morning, midday, afternoon]
        default: midday
      dry_run:
        description: "Build the card and captions, print them, post nothing"
        type: boolean
        default: false

permissions:
  contents: write

# Kept as ONE shared group (not per-slot) on purpose: all three slots still
# commit to the same social/ directory in the same working tree, and never
# running two of these jobs at once is simpler to reason about than relying
# on push-with-retry.sh to untangle a genuine concurrent push. Six crons a
# day means less spacing between some triggers than before, so this matters
# more than it used to -- a run is queued and waits its turn rather than
# racing another. Never cancel in flight: a run killed between the Facebook
# post and the Instagram post loses the log entry that stops the next run
# reposting to Facebook.
concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The one pip install in this repo. scripts/fetch_events.py stays
      # stdlib-only because it must run with no install step; that constraint
      # is about the aggregator, not the repository.
      - name: Install Pillow
        run: pip install --disable-pip-version-check "Pillow~=12.3"

      # github.event.schedule carries the exact cron string that fired, which
      # is the one reliable way to know which slot a scheduled run is -- wall-
      # clock time at the moment the job actually starts running can slip by
      # HOURS under GitHub's own queuing delay (measured, not theoretical --
      # see the schedule: comment above), so a run landing near a given hour
      # is not proof of which slot it is; the cron TIMES were deliberately
      # shifted off the target times for exactly this reason. Only
      # workflow_dispatch has no schedule string, so that's the one case that
      # falls back to the manual `slot` input.
      - name: Determine slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 9 * * *")  echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
            "0 14 * * *") echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
            "0 13 * * *") echo "slot=midday" >> "$GITHUB_OUTPUT" ;;
            "0 18 * * *") echo "slot=midday" >> "$GITHUB_OUTPUT" ;;
            "0 16 * * *") echo "slot=afternoon" >> "$GITHUB_OUTPUT" ;;
            "0 21 * * *") echo "slot=afternoon" >> "$GITHUB_OUTPUT" ;;
            *) echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Pick events and render the card
        id: build
        # The secrets are in scope here only so build can tell "not set up
        # yet" (both unset -> skip the whole run quietly, no card committed)
        # from "misconfigured" (one unset -> fail). It makes no API calls.
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          python scripts/social_post.py build \
            --slot "${{ steps.slot.outputs.slot }}" \
            --plan "$RUNNER_TEMP/plan.json" \
            --font-cache "$RUNNER_TEMP/fonts"
          if python -c "import json,sys; sys.exit(0 if json.load(open('$RUNNER_TEMP/plan.json')).get('skip') else 1)"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The card must be live on GitHub Pages BEFORE the Instagram call:
      # its Content Publishing API takes an image_url that Meta's own servers
      # fetch, not image bytes. Hence commit-then-publish rather than one step.
      #
      # Per CLAUDE.md: every path a script writes must be listed here, or it
      # is regenerated on the runner and thrown away at the end of the job.
      # social/ covers both cards/ and posted.json.
      - name: Commit the card
        if: steps.build.outputs.skip == 'false' && !inputs.dry_run
        run: |
          git config user.name "social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A social
          if git diff --cached --quiet; then
            echo "Card unchanged."
          else
            git commit -m "chore: social card for $(date -u +%F) [${{ steps.slot.outputs.slot }}]"
            ./.github/push-with-retry.sh
          fi

      - name: Post to Facebook and Instagram
        if: steps.build.outputs.skip == 'false'
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          python scripts/social_post.py publish \
            --plan "$RUNNER_TEMP/plan.json" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Runs even when publishing failed: social_post.py writes the log after
      # EACH platform, so a Facebook-succeeded/Instagram-failed run must still
      # commit that fact or the retry reposts to Facebook.
      - name: Commit the posted log
        if: always() && steps.build.outputs.skip == 'false' && !inputs.dry_run
        run: |
          git config user.name "social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A social
          if git diff --cached --quiet; then
            echo "Log unchanged."
          else
            git commit -m "chore: social post log for $(date -u +%F) [${{ steps.slot.outputs.slot }}]"
            ./.github/push-with-retry.sh
          fi
