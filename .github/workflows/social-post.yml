name: Daily social post

# Deliberately its own workflow rather than a job bolted onto
# fetch-events.yml. The nightly refresh is the site; this is marketing. A dead
# Meta token, a rate limit or an Instagram outage must never be able to leave
# /tonight/ serving yesterday, and a collapsed feed (COLLAPSE_GUARD_RATIO)
# must never be able to post garbage. Neither one can fail the other here.

on:
  # Two posts a day since 2026-08-31, each with distinct picks -- see
  # already_posted_today() in social_post.py, which hard-excludes anything
  # the earlier slot already featured. Times are Dallas wall-clock, pinned to
  # CDT (UTC-5, the offset in effect when these were chosen): 13:00 UTC =
  # 8:00 AM, 17:00 UTC = 12:00 PM. GitHub Actions cron has no timezone
  # concept, so once Dallas falls back to CST (UTC-6) in November both slots
  # read an hour earlier on the clock -- 7:00 AM / 11:00 AM -- until DST
  # resumes. This is the same tolerance fetch-events.yml already accepts for
  # its own "3-4 AM Dallas" / "11 AM-noon Dallas" cron comments; a
  # timezone-correct schedule would need a wrapper that checks the date and
  # no-ops on the wrong hour, which is more machinery than an hour of seasonal
  # drift on a marketing post has ever justified.
  #
  # The 17:00 UTC slot exactly matches fetch-events.yml's second (catch-up)
  # cron. That is a known, accepted overlap, not an oversight: both jobs
  # already push through push-with-retry.sh, which rebases and retries rather
  # than failing, so a same-minute collision costs a few seconds of retry, not
  # a broken run. Whichever side of the race the midday post lands on, it
  # still reads a live-events.json from within the last few hours.
  schedule:
    - cron: "0 13 * * *"   # ~8:00 AM Dallas -- "morning" slot
    - cron: "0 17 * * *"   # ~12:00 PM Dallas -- "midday" slot
  workflow_dispatch:
    inputs:
      slot:
        description: "Which of the day's two posts to run (ignored on a schedule -- that's inferred from which cron fired)"
        type: choice
        options: [morning, midday]
        default: midday
      dry_run:
        description: "Build the card and captions, print them, post nothing"
        type: boolean
        default: false

permissions:
  contents: write

# Kept as ONE shared group (not per-slot) on purpose: the two slots still
# commit to the same social/ directory in the same working tree, and never
# running two of these jobs at once is simpler to reason about than relying
# on push-with-retry.sh to untangle a genuine concurrent push. They are hours
# apart on the real schedule, so this only ever matters for a manual dispatch
# landing mid-run. Never cancel in flight: a run killed between the Facebook
# post and the Instagram post loses the log entry that stops the next run
# reposting to Facebook.
concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The one pip install in this repo. scripts/fetch_events.py stays
      # stdlib-only because it must run with no install step; that constraint
      # is about the aggregator, not the repository.
      - name: Install Pillow
        run: pip install --disable-pip-version-check "Pillow~=12.3"

      # github.event.schedule carries the exact cron string that fired, which
      # is the one reliable way to know which slot a scheduled run is -- wall-
      # clock time at the moment the job actually starts running can slip by
      # minutes under GitHub's own queuing delay. Only workflow_dispatch has
      # no schedule string, so that's the one case that falls back to the
      # manual `slot` input.
      - name: Determine slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 13 * * *") echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
            "0 17 * * *") echo "slot=midday" >> "$GITHUB_OUTPUT" ;;
            *) echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Pick events and render the card
        id: build
        # The secrets are in scope here only so build can tell "not set up
        # yet" (both unset -> skip the whole run quietly, no card committed)
        # from "misconfigured" (one unset -> fail). It makes no API calls.
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          python scripts/social_post.py build \
            --slot "${{ steps.slot.outputs.slot }}" \
            --plan "$RUNNER_TEMP/plan.json" \
            --font-cache "$RUNNER_TEMP/fonts"
          if python -c "import json,sys; sys.exit(0 if json.load(open('$RUNNER_TEMP/plan.json')).get('skip') else 1)"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The card must be live on GitHub Pages BEFORE the Instagram call:
      # its Content Publishing API takes an image_url that Meta's own servers
      # fetch, not image bytes. Hence commit-then-publish rather than one step.
      #
      # Per CLAUDE.md: every path a script writes must be listed here, or it
      # is regenerated on the runner and thrown away at the end of the job.
      # social/ covers both cards/ and posted.json.
      - name: Commit the card
        if: steps.build.outputs.skip == 'false' && !inputs.dry_run
        run: |
          git config user.name "social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A social
          if git diff --cached --quiet; then
            echo "Card unchanged."
          else
            git commit -m "chore: social card for $(date -u +%F) [${{ steps.slot.outputs.slot }}]"
            ./.github/push-with-retry.sh
          fi

      - name: Post to Facebook and Instagram
        if: steps.build.outputs.skip == 'false'
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          python scripts/social_post.py publish \
            --plan "$RUNNER_TEMP/plan.json" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Runs even when publishing failed: social_post.py writes the log after
      # EACH platform, so a Facebook-succeeded/Instagram-failed run must still
      # commit that fact or the retry reposts to Facebook.
      - name: Commit the posted log
        if: always() && steps.build.outputs.skip == 'false' && !inputs.dry_run
        run: |
          git config user.name "social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A social
          if git diff --cached --quiet; then
            echo "Log unchanged."
          else
            git commit -m "chore: social post log for $(date -u +%F) [${{ steps.slot.outputs.slot }}]"
            ./.github/push-with-retry.sh
          fi
